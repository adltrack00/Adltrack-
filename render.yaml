# Render Blueprint: Dashboard > New > Blueprint, pick this repo.
services:
  - type: web
    name: delivery
    runtime: docker
    plan: starter  # paid: stays awake, no cold starts
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional. Without it ADA still works, using the simpler assistant built into the app.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADA_MODEL
        value: claude-opus-5-5
      # WhatsApp. Without these the app runs on the test line (phone simulator on the company's WhatsApp page).
      # Meta Cloud API: token, phone number id, a verify token you choose, and the app secret that signs webhooks.
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_DISPLAY_NUMBER
        sync: false
      # Voice notes typed out (any OpenAI-compatible speech-to-text key).
      - key: STT_API_KEY
        sync: false
      # Phone calls through Twilio Voice. Without these, calls are simulated in the app.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VOICE_FROM
        sync: false
      # Where the shared delivery data (vendors, stock, riders, orders, deliveries) is kept.
      - key: DATABASE_URL
        fromDatabase:
          name: delivery-db
          property: connectionString

databases:
  - name: delivery-db
    plan: basic-256mb  # paid: does not expire
    databaseName: delivery
    user: delivery
