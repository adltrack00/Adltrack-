# Render Blueprint: Dashboard > New > Blueprint, pick this repo.
services:
  - type: web
    name: delivery
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Optional. Without it ADA still works, using the simpler assistant built into the app.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADA_MODEL
        value: claude-opus-5-5
      # Where the shared delivery data (vendors, stock, riders, orders, deliveries) is kept.
      - key: DATABASE_URL
        fromDatabase:
          name: delivery-db
          property: connectionString

databases:
  - name: delivery-db
    plan: free
    databaseName: delivery
    user: delivery
